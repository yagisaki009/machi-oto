<!DOCTYPE html>
<html lang="ja" manifest="offline.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="まちのおと">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#fdf1d8">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>まちの おとさがし</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#fdf1d8;}
*{-webkit-box-sizing:border-box;box-sizing:border-box;}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:#4a2c12;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);
  -webkit-text-size-adjust:100%;touch-action:none;}

/* 縦向きの画面（縦ロックのスマホなど）では、#app ごと90度まわして横向きで見せる */
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;-webkit-transform-origin:0 0;transform-origin:0 0;}
#stage{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;}
#pic{position:absolute;display:block;-webkit-user-drag:none;}
#pops,#fx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;}

/* おした物がふわっと1.1倍に */
.sprite{position:absolute;-webkit-transform-origin:50% 50%;transform-origin:50% 50%;
  -webkit-transition:-webkit-transform .18s cubic-bezier(.3,1.7,.5,1);transition:transform .18s cubic-bezier(.3,1.7,.5,1);
}
.sprite.on{-webkit-transform:scale(1.1);transform:scale(1.1);}

/* 鳴っているあいだ、物のまわりにキラキラ（絵と同じ黄色・同じ線の色で描いた ✨。光らせない） */
.spk{position:absolute;pointer-events:none;background-repeat:no-repeat;background-size:100% 100%;
  -webkit-animation:spk 1s ease-out forwards;animation:spk 1s ease-out forwards;}
@-webkit-keyframes spk{0%{-webkit-transform:scale(0) rotate(-12deg);opacity:1}28%{-webkit-transform:scale(1.1) rotate(0);opacity:1}
  42%{-webkit-transform:scale(1)}72%{-webkit-transform:scale(1);opacity:1}100%{-webkit-transform:scale(.75);opacity:0}}
@keyframes spk{0%{transform:scale(0) rotate(-12deg);opacity:1}28%{transform:scale(1.1) rotate(0);opacity:1}
  42%{transform:scale(1)}72%{transform:scale(1);opacity:1}100%{transform:scale(.75);opacity:0}}

/* ふきだし */
.bubble{position:absolute;max-width:80%;background:#fff;border:3px solid #4a2c12;border-radius:18px;padding:6px 14px;
  font-size:18px;font-weight:bold;line-height:1.35;color:#4a2c12;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.18);
  -webkit-animation:bin .22s cubic-bezier(.3,1.6,.5,1);animation:bin .22s cubic-bezier(.3,1.6,.5,1);}
.bubble i{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;background:#fff;border:3px solid #4a2c12;
  -webkit-transform:rotate(45deg);transform:rotate(45deg);}
.bubble.up i{bottom:-9px;border-top:none;border-left:none;}
.bubble.down i{top:-9px;border-bottom:none;border-right:none;}
@-webkit-keyframes bin{from{-webkit-transform:scale(.4);opacity:0}to{-webkit-transform:scale(1);opacity:1}}
@keyframes bin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* 背景をおしたときの波紋と音符 */
.ring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:5px solid #fff;
  box-shadow:0 0 6px rgba(0,0,0,.25);-webkit-animation:ring .7s ease-out forwards;animation:ring .7s ease-out forwards;}
@-webkit-keyframes ring{0%{-webkit-transform:scale(.2);opacity:1}100%{-webkit-transform:scale(1.7);opacity:0}}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.7);opacity:0}}
.note{position:absolute;width:30px;margin-left:-15px;text-align:center;font-size:26px;font-weight:bold;line-height:1;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 2px 0 #fff;-webkit-animation:fly 1s ease-out forwards;animation:fly 1s ease-out forwards;}
@-webkit-keyframes fly{0%{-webkit-transform:translate(0,0) scale(.5);opacity:1}100%{-webkit-transform:translate(0,-90px) scale(1.3);opacity:0}}
@keyframes fly{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(0,-90px) scale(1.3);opacity:0}}

#pills{position:absolute;right:10px;top:8px;z-index:5;white-space:nowrap;}
.pill{position:relative;display:inline-block;height:34px;line-height:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.88);
  box-shadow:0 2px 0 rgba(74,44,18,.18);font-size:14px;font-weight:bold;overflow:hidden;}
.pill .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffc078;}
.pill.holding .fill{width:100%;-webkit-transition:width .9s linear;transition:width .9s linear;}
.pill span{position:relative;}
.pill .hint{font-size:10px;font-weight:normal;opacity:.6;margin-left:5px;}


#start{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(253,241,216,.94);z-index:10;text-align:center;
  -webkit-transition:opacity .35s;transition:opacity .35s;}
#start.gone{opacity:0;}
#sTitle{position:absolute;left:0;right:0;top:10%;font-size:36px;font-weight:bold;letter-spacing:2px;}
#sSub{position:absolute;left:0;right:0;top:10%;margin-top:52px;font-size:19px;}
#startBtn{position:absolute;left:50%;top:52%;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;
  background:#ff922b;color:#fff;box-shadow:inset 0 -12px 0 rgba(0,0,0,.15),0 8px 0 rgba(74,44,18,.15);}
#startBtn .big{font-size:110px;line-height:1;margin-top:50px;-webkit-animation:hop .7s ease-in-out infinite alternate;animation:hop .7s ease-in-out infinite alternate;}
#startBtn .go{font-size:23px;font-weight:bold;margin-top:14px;}
@-webkit-keyframes hop{from{-webkit-transform:translateY(0)}to{-webkit-transform:translateY(-12px)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-12px)}}
#hint{position:absolute;left:24px;right:24px;bottom:4%;font-size:14px;line-height:1.8;opacity:.75;}
/* 背の低い画面（スマホの横向き）では、はじめる画面を小さめに */
#app.short #sTitle{top:6%;font-size:26px;}
#app.short #sSub{margin-top:38px;font-size:15px;}
#app.short #startBtn{top:56%;width:170px;height:170px;margin:-85px 0 0 -85px;}
#app.short #startBtn .big{font-size:64px;margin-top:30px;}
#app.short #startBtn .go{font-size:16px;margin-top:6px;}
#app.short #hint{display:none;}
</style>
</head>
<body>
<div id="app">
<div id="stage">
  <img id="pic" src="machi.jpg" alt="">
  <div id="pops"></div>
  <div id="fx"></div>
</div>
<div id="pills">
  <div class="pill" id="vol"><i class="fill"></i><span id="volIcon">🔉</span> <span id="volText">ふつう</span><span class="hint">ながおし</span></div>
</div>
<div id="start">
  <div id="sTitle">まちの おとさがし</div>
  <div id="sSub">えの なかの ひとや どうぶつ、のりものを おしてみよう！</div>
  <div id="startBtn"><div class="big">👆</div><div class="go">タップして はじめる</div></div>
  <div id="hint">音が出ないときは、iPadの消音（マナーモード）をオフにして音量を上げてください。<br>右上の 🔉 を長押しすると、音の大きさを3段階で変えられます。</div>
</div>
</div>

<script src="scene.js"></script>
<script>
(function () {
/* ===== 古いiPad(iOS 9〜)でも動くよう ES5 だけで書いています ===== */
var SC = window.SCENE, IW = SC.w, IH = SC.h, OBJ = SC.objects, ZON = SC.zones;

/* ---------- 当たり判定 ---------- */
function prep(o) {
  var p = o.poly, x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, a = 0;
  for (var i = 0; i < p.length; i += 2) {
    var x = p[i], y = p[i + 1], j = (i + 2) % p.length;
    if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y;
    a += x * p[j + 1] - p[j] * y;
  }
  o.bb = [x0, y0, x1, y1]; o.area = Math.abs(a) / 2;
}
for (var q = 0; q < OBJ.length; q++) { prep(OBJ[q]); OBJ[q].isObj = true; }
for (q = 0; q < ZON.length; q++) prep(ZON[q]);
var BY_AREA = OBJ.slice().sort(function (a, b) { return a.area - b.area; });

function inPoly(p, x, y) {
  var c = false;
  for (var i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    var xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
/* 小さい物から順に調べ（屋根の上のねこ＞ラーメン屋）、どれでもなければ背景エリア。それも外れたら近い背景 */
function hitTest(x, y) {
  var i, o;
  for (i = 0; i < BY_AREA.length; i++) {
    o = BY_AREA[i];
    if (x >= o.bb[0] && x <= o.bb[2] && y >= o.bb[1] && y <= o.bb[3] && inPoly(o.poly, x, y)) return o;
  }
  for (i = 0; i < ZON.length; i++) if (inPoly(ZON[i].poly, x, y)) return ZON[i];
  var best = null, bd = 1e18;
  for (i = 0; i < ZON.length; i++) {
    var b = ZON[i].bb, dx = Math.max(b[0] - x, 0, x - b[2]), dy = Math.max(b[1] - y, 0, y - b[3]), d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = ZON[i]; }
  }
  return best;
}

/* ---------- 画面の大きさに合わせる ---------- */
var pic = document.getElementById('pic'), pops = document.getElementById('pops'), fx = document.getElementById('fx');
var view = { s: 1, ox: 0, oy: 0 };
var app = document.getElementById('app'), rot = false, VW = 0, VH = 0;   /* VW, VH = 横向きにしたときの幅と高さ */
function layout() {
  var sw = window.innerWidth, sh = window.innerHeight;
  rot = sh > sw;
  VW = rot ? sh : sw; VH = rot ? sw : sh;
  app.style.width = VW + 'px'; app.style.height = VH + 'px';
  /* スマホを左に倒した向き（上が左）で、ちょうど正しく見える */
  var tf = rot ? 'translate(' + sw + 'px,0) rotate(90deg)' : 'none';
  app.style.webkitTransform = tf; app.style.transform = tf;
  app.className = VH < 560 ? 'short' : '';
  var W = VW, H = VH;
  var s = Math.min(W / IW, H / IH);
  view.s = s; view.ox = Math.round((W - IW * s) / 2); view.oy = Math.round((H - IH * s) / 2);
  pic.style.left = view.ox + 'px'; pic.style.top = view.oy + 'px';
  pic.style.width = Math.round(IW * s) + 'px'; pic.style.height = Math.round(IH * s) + 'px';
  for (var id in sprites) if (sprites.hasOwnProperty(id)) placeSprite(sprites[id]);
}
/* 画面の点（指の位置）を、まわしたあとの点に */
function toView(x, y) { return rot ? [y, window.innerWidth - x] : [x, y]; }
function toImage(cx, cy) {
  var x = (cx - view.ox) / view.s, y = (cy - view.oy) / view.s;
  /* 絵の外（上下の余白）をおしても、いちばん近い所が鳴る */
  return [Math.max(0, Math.min(IW - 1, x)), Math.max(0, Math.min(IH - 1, y))];
}

/* ---------- 1.1倍にふくらむ絵（その物の形で切りぬく） ---------- */
var sprites = {};
/* ふちをやわらかく：形を少しふくらませて角を丸め、外側へ向かってぼかす（絵の点の数で） */
var GROW = 4, SOFT = 9;
function polyPath(g, p, dx, dy) {
  g.beginPath(); g.moveTo(p[0] + dx, p[1] + dy);
  for (var i = 2; i < p.length; i += 2) g.lineTo(p[i] + dx, p[i + 1] + dy);
  g.closePath();
}
function softMask(p, x0, y0, w, h) {
  var s = document.createElement('canvas'); s.width = w; s.height = h;
  var sg = s.getContext('2d');
  sg.fillStyle = sg.strokeStyle = '#000'; sg.lineJoin = 'round'; sg.lineWidth = GROW * 2;
  polyPath(sg, p, -x0, -y0); sg.fill(); sg.stroke();
  /* 形は画面の外にかいて、ぼかした影だけを元の場所に落とす（古いSafariでも使えるぼかし方） */
  var m = document.createElement('canvas'); m.width = w; m.height = h;
  var mg = m.getContext('2d'), far = w + 40;
  mg.shadowColor = '#000'; mg.shadowBlur = SOFT; mg.shadowOffsetX = far; mg.shadowOffsetY = 0;
  mg.drawImage(s, -far, 0);
  /* 影が出ない古い端末では、ぼかさずに丸めた形だけ使う（まん中の段に、ちゃんと形があるかで判断） */
  var ok = false;
  try {
    var d = mg.getImageData(0, h >> 1, w, 1).data;
    for (var k = 3; k < d.length; k += 4) if (d[k] > 100) { ok = true; break; }
  } catch (e) { ok = true; }
  return ok ? m : s;
}
function makeSprite(o) {
  if (sprites[o.id]) return sprites[o.id];
  var b = o.bb, pad = GROW + SOFT;
  var x0 = Math.max(0, Math.floor(b[0]) - pad), y0 = Math.max(0, Math.floor(b[1]) - pad);
  var w = Math.min(IW, Math.ceil(b[2]) + pad) - x0, h = Math.min(IH, Math.ceil(b[3]) + pad) - y0;
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d');
  g.drawImage(pic, -x0, -y0);
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(softMask(o.poly, x0, y0, w, h), 0, 0);
  g.globalCompositeOperation = 'source-over';
  c.className = 'sprite';
  var sp = { el: c, x0: x0, y0: y0, w: w, h: h, timer: null };
  sprites[o.id] = sp;
  return sp;
}
function placeSprite(sp) {
  sp.el.style.left = (view.ox + sp.x0 * view.s) + 'px';
  sp.el.style.top = (view.oy + sp.y0 * view.s) + 'px';
  sp.el.style.width = (sp.w * view.s) + 'px';
  sp.el.style.height = (sp.h * view.s) + 'px';
}
function popOn(o) {
  var sp = makeSprite(o);
  clearTimeout(sp.timer);
  placeSprite(sp);
  if (sp.el.parentNode !== pops) {
    sp.el.className = 'sprite';
    pops.appendChild(sp.el);
    void sp.el.offsetWidth;
  }
  sp.el.className = 'sprite on';
}
function popOff(o) {
  var sp = sprites[o.id];
  if (!sp) return;
  sp.el.className = 'sprite';
  clearTimeout(sp.timer);
  sp.timer = setTimeout(function () { if (sp.el.parentNode) sp.el.parentNode.removeChild(sp.el); }, 250);
}

/* ふきだし */
var bubbles = {};
function showBubble(o) {
  hideBubble(o);
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(o.text));
  d.appendChild(document.createElement('i'));
  d.className = 'bubble up';
  d.style.left = '0px'; d.style.top = '0px';
  fx.appendChild(d);
  var cx = view.ox + (o.bb[0] + o.bb[2]) / 2 * view.s;
  var top = view.oy + o.bb[1] * view.s, bottom = view.oy + o.bb[3] * view.s;
  var bw = d.offsetWidth, bh = d.offsetHeight, W = VW;
  var left = Math.max(6, Math.min(W - bw - 6, cx - bw / 2));
  var up = top - bh - 14 > 4;
  d.className = 'bubble ' + (up ? 'up' : 'down');
  d.style.left = left + 'px';
  d.style.top = (up ? top - bh - 14 : bottom + 14) + 'px';
  d.lastChild.style.left = Math.max(16, Math.min(bw - 16, cx - left)) + 'px';
  bubbles[o.id] = d;
}
function hideBubble(o) {
  var d = bubbles[o.id];
  if (d && d.parentNode) d.parentNode.removeChild(d);
  bubbles[o.id] = null;
}

var SYM = ['♪', '♫', '★', '♪'], PCOL = ['#ff6b6b', '#4dabf7', '#fcc419', '#51cf66', '#9775fa', '#f06595'];
function ripple(cx, cy) {
  if (fx.childNodes.length > 30) return;
  var r = document.createElement('div');
  r.className = 'ring'; r.style.left = cx + 'px'; r.style.top = cy + 'px';
  fx.appendChild(r); removeLater(r, 750);
  for (var k = 0; k < 2; k++) {
    var n = document.createElement('div');
    n.className = 'note';
    n.textContent = SYM[Math.floor(Math.random() * SYM.length)];
    n.style.color = PCOL[Math.floor(Math.random() * PCOL.length)];
    n.style.left = (cx + (k ? 22 : -22)) + 'px'; n.style.top = (cy - 20) + 'px';
    fx.appendChild(n); removeLater(n, 1050);
  }
}
/* キラキラの絵：4つのとがりの星（辺は内側にカーブ）。黄色＋右下だけ濃い黄色の影＋こげ茶の線（絵から取った色） */
var SPK_IMG = (function () {
  var Y = '#f0cd36', D = '#de9a26', L = '#27240f';
  function P(x, y) { return (Math.round(x * 10) / 10) + ' ' + (Math.round(y * 10) / 10); }
  function star(cx, cy, r, sw) {
    var k = r * 0.2;
    var o = 'M' + P(cx, cy - r) + 'Q' + P(cx + k, cy - k) + ' ' + P(cx + r, cy) + 'Q' + P(cx + k, cy + k) + ' ' + P(cx, cy + r) +
            'Q' + P(cx - k, cy + k) + ' ' + P(cx - r, cy) + 'Q' + P(cx - k, cy - k) + ' ' + P(cx, cy - r) + 'Z';
    var sh = 'M' + P(cx, cy) + 'L' + P(cx + r, cy) + 'Q' + P(cx + k, cy + k) + ' ' + P(cx, cy + r) + 'Z';
    return '<path d="' + o + '" fill="' + Y + '"/><path d="' + sh + '" fill="' + D + '"/>' +
           '<path d="' + o + '" fill="none" stroke="' + L + '" stroke-width="' + sw + '" stroke-linejoin="round"/>';
  }
  function uri(body) {
    return 'url("data:image/svg+xml;charset=utf-8,' +
      encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' + body + '</svg>') + '")';
  }
  /* trio = ✨ のように大・中・小の3つ、one = 1つだけ */
  return { trio: uri(star(60, 60, 35, 5) + star(20, 22, 15, 4) + star(18, 77, 9, 3.5)), one: uri(star(50, 50, 43, 6)) };
})();
/* キラキラ：物のふちのあたりに、ぽつぽつ出す */
var sparkTimers = {};
function sparkle(o, n) {
  if (fx.childNodes.length > 40) return;
  var b = o.bb, p = o.poly, cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
  var zoom = Math.max(0.8, Math.min(1.4, view.s * 1.2));
  for (var k = 0; k < n; k++) {
    var i = Math.floor(Math.random() * (p.length / 2)) * 2, j = (i + 2) % p.length, u = Math.random();
    var x = p[i] + (p[j] - p[i]) * u, y = p[i + 1] + (p[j + 1] - p[i + 1]) * u;
    var dx = x - cx, dy = y - cy, L = Math.sqrt(dx * dx + dy * dy) || 1, out = (Math.random() * 14 - 2) / view.s;
    x += dx / L * out; y += dy / L * out;
    x = cx + (x - cx) * 1.1; y = cy + (y - cy) * 1.1;   /* 1.1倍にふくらんだ絵に合わせる */
    var trio = Math.random() < 0.55, e = document.createElement('div');
    var sz = Math.round((trio ? 26 + Math.random() * 12 : 14 + Math.random() * 8) * zoom);
    e.className = 'spk';
    e.style.backgroundImage = trio ? SPK_IMG.trio : SPK_IMG.one;
    e.style.left = (view.ox + x * view.s - sz / 2) + 'px'; e.style.top = (view.oy + y * view.s - sz / 2) + 'px';
    e.style.width = e.style.height = sz + 'px';
    fx.appendChild(e); removeLater(e, 1050);
  }
}
function sparkOn(o) {
  sparkOff(o);
  sparkle(o, 3);
  sparkTimers[o.id] = setInterval(function () { sparkle(o, 1); }, 330);
}
function sparkOff(o) { if (sparkTimers[o.id]) { clearInterval(sparkTimers[o.id]); sparkTimers[o.id] = null; } }
function removeLater(el, ms) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, ms); }

/* ---------- 音 ---------- */
var AC = window.AudioContext || window.webkitAudioContext;
var ctx = null, master = null, unlocked = false;
var VOLS = [0.35, 0.65, 1.0], VOL_ICON = ['🔈', '🔉', '🔊'], VOL_NAME = ['ちいさい', 'ふつう', 'おおきい'], volIdx = 1;
try { var sv = localStorage.getItem('machi-oto-vol'); if (sv !== null && VOLS[+sv] !== undefined) volIdx = +sv; } catch (e) {}
/* 古いiPad（webkitAudioContextだけ）はメモリが少ないので、音のデータを持っておく数を減らす */
var MAX_BUFS = window.AudioContext ? 400 : 36;

function setupGraph(c) {
  var comp = c.createDynamicsCompressor();
  try { comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2; } catch (e) {}
  var m = c.createGain(); m.gain.value = VOLS[volIdx];
  m.connect(comp); comp.connect(c.destination);
  return m;
}
function resume() {
  if (ctx && ctx.state && ctx.state !== 'running' && ctx.resume) {
    try { var p = ctx.resume(); if (p && p['catch']) p['catch'](function () {}); } catch (e) {}
  }
}
function unlock() {
  if (!AC) return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e0) {}
  if (!ctx) {
    try { ctx = new AC(); } catch (e) { return; }
    master = setupGraph(ctx);
    setTimeout(predecode, 300);
  }
  resume();
  if (!unlocked) {
    try { var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch (e2) {}
    unlocked = true;
  }
}

/* 使う音の一覧（セリフを先に） */
var NAMES = [], seenName = {};
function addName(n) { if (n && !seenName[n]) { seenName[n] = 1; NAMES.push(n); } }
for (q = 0; q < OBJ.length; q++) addName(OBJ[q].voice);
for (q = 0; q < OBJ.length; q++) addName(OBJ[q].sfx);
for (q = 0; q < ZON.length; q++) addName(ZON[q].sfx);

var raw = {}, fetchQ = {}, bufs = {}, used = {}, tick = 0, nBufs = 0, decQ = {};
function fetchRaw(name, cb) {
  if (raw[name]) { cb(true); return; }
  if (fetchQ[name]) { fetchQ[name].push(cb); return; }
  fetchQ[name] = [cb];
  var x = new XMLHttpRequest();
  function fin(ok) { var qq = fetchQ[name]; fetchQ[name] = null; for (var i = 0; i < qq.length; i++) qq[i](ok); }
  x.open('GET', 'sounds/' + name + '.m4a', true);
  x.responseType = 'arraybuffer';
  x.onload = function () {
    var ok = (x.status === 200 || x.status === 0) && x.response && x.response.byteLength > 0;
    if (ok) raw[name] = x.response;
    fin(!!ok);
  };
  x.onerror = function () { fin(false); };
  x.send();
}
function evict() {
  while (nBufs > MAX_BUFS) {
    var old = null, ou = 1e18;
    for (var k in bufs) if (bufs.hasOwnProperty(k) && used[k] < ou) { ou = used[k]; old = k; }
    if (!old) break;
    delete bufs[old]; nBufs--;   /* 鳴っている途中の音は消えない（再生中は音のほうが持っている） */
  }
}
function getBuf(name, cb) {
  if (!name) { cb(null); return; }
  if (bufs[name]) { used[name] = ++tick; cb(bufs[name]); return; }
  if (decQ[name]) { decQ[name].push(cb); return; }
  decQ[name] = [cb];
  function fin(b) { var qq = decQ[name]; decQ[name] = null; for (var i = 0; i < qq.length; i++) qq[i](b); }
  fetchRaw(name, function (ok) {
    if (!ok || !ctx) { fin(null); return; }
    var called = false;
    function done(b) {
      if (called) return;
      called = true;
      if (b) { if (!bufs[name]) nBufs++; bufs[name] = b; used[name] = ++tick; evict(); }
      fin(b);
    }
    try {
      var p = ctx.decodeAudioData(raw[name].slice(0), function (b) { done(b); }, function () { done(null); });
      if (p && p['catch']) p['catch'](function () { done(null); });
    } catch (e) { done(null); }
  });
}
/* ファイルは最初に全部取っておく（オフラインでもすぐ鳴るように） */
function prefetch() {
  var i = 0, running = 0;
  function next() {
    while (running < 2 && i < NAMES.length) {
      running++;
      fetchRaw(NAMES[i++], function () { running--; next(); });
    }
  }
  next();
}
/* はじめたあと、ひまなときに音のデータを用意しておく */
function predecode() {
  var i = 0;
  function next() {
    if (i >= NAMES.length || nBufs >= MAX_BUFS * 0.8) return;
    getBuf(NAMES[i++], function () { setTimeout(next, 30); });
  }
  next();
}

/* 1回おしたぶんの音のまとまり */
var active = {}, MAX_GROUPS = 5;
function Group(t) { this.out = ctx.createGain(); this.out.connect(master); this.srcs = []; this.end = 0; this.dead = false; this.target = t; this.t0 = ctx.currentTime; }
function startBuf(g, buf, t, gain) {
  var s = ctx.createBufferSource(), a = ctx.createGain();
  s.buffer = buf; a.gain.value = gain;
  s.connect(a); a.connect(g.out);
  s.start(t);
  g.srcs.push(s);
  if (t + buf.duration > g.end) g.end = t + buf.duration;
}
function killGroup(g, fade) {
  if (!g || g.dead) return;
  g.dead = true;
  var now = ctx.currentTime;
  try { g.out.gain.cancelScheduledValues(now); g.out.gain.setValueAtTime(g.out.gain.value, now); g.out.gain.linearRampToValueAtTime(0, now + fade); } catch (e) {}
  for (var i = 0; i < g.srcs.length; i++) { try { g.srcs[i].stop(now + fade + 0.02); } catch (e2) {} }
  setTimeout(function () { try { g.out.disconnect(); } catch (e3) {} }, (fade + 0.2) * 1000);
}
function finishVisual(t) { if (t.isObj) { popOff(t); hideBubble(t); sparkOff(t); } }

function trigger(t, cx, cy) {
  if (t.isObj) { popOn(t); sparkOn(t); if (t.text) showBubble(t); }
  else ripple(cx, cy);
  if (!ctx) { setTimeout(function () { finishVisual(t); }, 900); return; }
  resume();
  killGroup(active[t.id], 0.06);
  var live = [];
  for (var k in active) if (active.hasOwnProperty(k) && active[k] && !active[k].dead) live.push(active[k]);
  if (live.length >= MAX_GROUPS) {
    live.sort(function (a, b) { return a.t0 - b.t0; });
    killGroup(live[0], 0.08); finishVisual(live[0].target); active[live[0].target.id] = null;
  }
  var g = new Group(t);
  active[t.id] = g;
  var got = {}, left = 2;
  function ready() {
    if (--left > 0 || g.dead) return;
    var now = ctx.currentTime + 0.02, sb = got.s, vb = got.v;
    if (sb && vb) {
      if (t.order === 'voice') { startBuf(g, vb, now, 1); startBuf(g, sb, now + Math.max(0, vb.duration - 0.25), 0.9); }
      else if (t.order === 'sfx') { startBuf(g, sb, now, 0.9); startBuf(g, vb, now + Math.min(0.8, sb.duration * 0.5), 1); }
      else { startBuf(g, sb, now, 0.55); startBuf(g, vb, now + 0.15, 1); }
    } else if (sb) startBuf(g, sb, now, 1);
    else if (vb) startBuf(g, vb, now, 1);
    var ms = Math.max(0.8, g.end - ctx.currentTime) * 1000;
    setTimeout(function () {
      if (active[t.id] === g) { active[t.id] = null; finishVisual(t); }
      try { g.out.disconnect(); } catch (e) {}
    }, ms + 60);
  }
  getBuf(t.sfx, function (b) { got.s = b; ready(); });
  getBuf(t.voice, function (b) { got.v = b; ready(); });
}

/* ---------- 音の大きさ（長押しで切りかえ） ---------- */
function $(id) { return document.getElementById(id); }
function showVol() {
  $('volIcon').textContent = VOL_ICON[volIdx];
  $('volText').textContent = VOL_NAME[volIdx];
  if (master) master.gain.value = VOLS[volIdx];
}
var holdTimer = null, holdEl = null;
function holdPress(el) {
  holdRelease();
  holdEl = el; el.className = 'pill holding';
  holdTimer = setTimeout(function () {
    holdTimer = null; holdRelease();
    volIdx = (volIdx + 1) % VOLS.length; showVol();
    try { localStorage.setItem('machi-oto-vol', String(volIdx)); } catch (e) {}
    var z = ZON[0]; if (ctx) trigger(z, VW - 60, 60);
  }, 900);
}
function holdRelease() {
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  if (holdEl) { holdEl.className = 'pill'; holdEl = null; }
}
showVol();

/* ---------- はじめる ---------- */
/* iPad の Safari では、はじめるときに全画面（タブやアドレスバーを消す）。
   iPhone の Safari は全画面にできないので、ホーム画面に追加して使う */
function goFull() {
  if (window.navigator.standalone) return;
  var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
  if (!f || document.fullscreenElement || document.webkitFullscreenElement) return;
  try { var r = f.call(d); if (r && r['catch']) r['catch'](function () {}); } catch (e) {}
}
var started = false;
function start() {
  if (started) return;
  started = true;
  goFull();
  var st = $('start'); st.className = 'gone';
  setTimeout(function () { st.style.display = 'none'; }, 400);
}
if (!AC) $('startBtn').lastChild.textContent = 'このブラウザでは音が出せません';

/* ---------- タッチ ---------- */
var passiveOK = false;
try {
  var po = Object.defineProperty({}, 'passive', { get: function () { passiveOK = true; return true; } });
  window.addEventListener('ptest', null, po); window.removeEventListener('ptest', null, po);
} catch (e) {}
var NP = passiveOK ? { passive: false } : false, lastTouch = 0;
function isPill(n) { while (n && n !== document) { if (n.id === 'vol') return n; n = n.parentNode; } return null; }
function press(sx, sy) {
  var v = toView(sx, sy), cx = v[0], cy = v[1];
  var ip = toImage(cx, cy), t = hitTest(ip[0], ip[1]);
  if (t) trigger(t, cx, cy);
}
document.addEventListener('touchstart', function (e) {
  e.preventDefault(); lastTouch = Date.now();
  if (!started) return;
  resume();
  for (var k = 0; k < e.changedTouches.length; k++) {
    var tc = e.changedTouches[k], pl = isPill(tc.target);
    if (pl) holdPress(pl); else press(tc.clientX, tc.clientY);
  }
}, NP);
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, NP);
document.addEventListener('touchend', function (e) {
  e.preventDefault(); lastTouch = Date.now();
  unlock();
  if (!started) { start(); return; }
  for (var k = 0; k < e.changedTouches.length; k++) if (isPill(e.changedTouches[k].target)) holdRelease();
}, NP);
document.addEventListener('touchcancel', function () { holdRelease(); }, NP);
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('mousedown', function (e) {
  if (Date.now() - lastTouch < 1000) return;
  unlock();
  if (!started) { start(); return; }
  var pl = isPill(e.target);
  if (pl) holdPress(pl); else press(e.clientX, e.clientY);
});
document.addEventListener('mouseup', function () { if (Date.now() - lastTouch < 1000) return; holdRelease(); });

layout();
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function () { setTimeout(layout, 300); });
if (pic.complete) layout(); else pic.onload = layout;
prefetch();

/* ---------- オフライン ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || /[?&]sw=1/.test(location.search))) {
  try { navigator.serviceWorker.register('sw.js')['catch'](function () {}); } catch (e) {}
}
if (window.applicationCache) {
  try { window.applicationCache.addEventListener('updateready', function () { try { window.applicationCache.swapCache(); } catch (e2) {} }); } catch (e) {}
}

/* 動作確認用（遊ぶときには使いません） */
window.__machi = {
  hit: function (x, y) { var t = hitTest(x, y); return t ? t.id : null; },
  pressAt: function (cx, cy) { press(cx, cy); },
  state: function () { return { audio: ctx ? (ctx.state || 'running') : 'none', fetched: Object.keys(raw).length, decoded: nBufs, names: NAMES.length }; },
  view: view
};
})();
</script>
